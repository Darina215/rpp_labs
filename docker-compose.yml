services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: library-app:lab3
    container_name: library-app
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: "${PORT:-8000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SEED_DATA: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          urllib.request.urlopen(
              "http://127.0.0.1:" + os.environ.get("PORT", "8000") + "/health"
          )
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped